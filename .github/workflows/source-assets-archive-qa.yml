name: Resort | Verificacao dos assets locais arquivados
on:
  push:
    branches: [chatgpt/importacao-assets-locais-20261008]
    paths:
      - 'ArtSource/LocalProjectOwned/**'
      - 'Tools/tests/test_owned_asset_archive.py'
      - 'Tools/automation/refresh_owned_asset_manifest.py'
      - '.github/workflows/source-assets-archive-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resort-owned-asset-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-source-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir e registrar SHA256 canonico dos arquivos Git
        run: python3 Tools/automation/refresh_owned_asset_manifest.py
      - name: Auditar todos os 38 assets no GitHub, sem PC
        run: python3 -m unittest discover -s Tools/tests -p 'test_owned_asset_archive.py' -v
      - name: Versionar apenas o manifesto reconciliado com Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArtSource/LocalProjectOwned/SOURCE_SHA256_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Manifest is already canonical"
          else
            git commit -m "qa: registrar hashes originais e Git para 38 assets proprios"
            git pull --rebase origin chatgpt/importacao-assets-locais-20261008
            git push origin HEAD:chatgpt/importacao-assets-locais-20261008
          fi
