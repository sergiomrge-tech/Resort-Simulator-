name: Resort R3 | Encaixe matematico em 3 footprints OSM
on:
  push:
    branches: [chatgpt/r3-piloto-osm-implantacao-real]
    paths:
      - 'Tools/geo/build_r3_exact_footprints.py'
      - 'Tools/geo/study_r3_model_fit.py'
      - 'Tools/tests/test_r3_fit_study.py'
      - '.github/workflows/r3-osm-fit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resort-r3-geometric-fit
  cancel-in-progress: true
jobs:
  calculate-original-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coordinate projection
        run: python -m pip install --disable-pip-version-check pyproj
      - name: Derive three exact rings from immutable OSM ways
        run: python Tools/geo/build_r3_exact_footprints.py
      - name: Check original FBX sizes against true OSM geometry
        run: python Tools/geo/study_r3_model_fit.py
      - name: Reject rectangles outside a ring and unproven heights
        run: python -m unittest discover -s Tools/tests -p test_r3_fit_study.py -v
      - name: Preserve deterministic site-fitting study
        uses: actions/upload-artifact@v4
        with:
          name: Resort-R3-FBX-Parcel-Fit-Study
          path: |
            geo/pilot/R3_EXACT_OSM_PARCELS.json
            geo/pilot/R3_MODEL_FIT_STUDY.json
          if-no-files-found: error
      - name: Store candidate blueprint without modifying city scene
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f geo/pilot/R3_EXACT_OSM_PARCELS.json geo/pilot/R3_MODEL_FIT_STUDY.json
          if ! git diff --cached --quiet; then
            git commit -m "geo(R3): footprint OSM exato e estudo de encaixe 3 modelos FBX"
            git pull --rebase origin chatgpt/r3-piloto-osm-implantacao-real
            git push origin HEAD:chatgpt/r3-piloto-osm-implantacao-real
          fi
