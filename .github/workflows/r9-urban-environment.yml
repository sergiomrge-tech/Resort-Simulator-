name: Resort R9 | OSM coastal pavement, sea, 48 full-crown tropical trees
on:
  push:
    branches: [codex/r9-urban-ground-vegetation]
    paths:
      - 'Tools/Blender/generate_r9_urban_environment.py'
      - 'Tools/Blender/select_r9_vegetation.py'
      - 'Tools/Blender/r9_tree_canopy.py'
      - 'Tools/geo/generate_r6_vegetation.py'
      - 'Tools/tests/test_r9_environment_native.py'
      - 'UnityProject/Assets/Editor/ResortR9*.cs'
      - 'ArtSource/Vegetation/R6/FBX/*.fbx'
      - 'geo/procedural/R6_VEGETATION_INSTANCES.json'
      - '.github/workflows/r9-urban-environment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resort-r9-urban-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static checks, frozen 2x1 coastline frame and prior R8/R7 contracts
        run: |
          set -euo pipefail
          python -m py_compile Tools/Blender/generate_r9_urban_environment.py Tools/Blender/select_r9_vegetation.py Tools/Blender/r9_tree_canopy.py Tools/tests/test_r9_environment_native.py
          python -m unittest discover -s Tools/tests -p 'test_r8_winding_geo.py' -v
          python -m unittest discover -s Tools/tests -p 'test_r7_contract.py' -v
      - name: Install authentic Blender Python and source GIS geometry dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri libopengl0 libx11-6
          python -m pip install --disable-pip-version-check 'bpy==4.5.3' 'pyproj==3.7.2' 'shapely==2.1.2'
      - name: Rebuild underlying real R7 city and preserve the street geometry
        run: |
          set -euo pipefail
          mkdir -p build/R9_CIQA
          python Tools/tests/test_r7_geometry_native.py 2>&1 | tee build/R9_CIQA/r7-smoke.log
          python -c "import bpy,sys,runpy;sys.argv=['blender','--','--mode','gallery','--no-render'];runpy.run_path('Tools/Blender/generate_r7_buildings.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/r7-models.log
          python Tools/geo/r7_mask_city_50.py 2>&1 | tee build/R9_CIQA/r7-mask.log
          python -c "import bpy,sys,runpy;sys.argv=['blender','--no-render'];runpy.run_path('Tools/Blender/assemble_r7_city_50.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/r7-city.log
          python Tools/tests/test_r7_exported_fbx_native.py 2>&1 | tee build/R9_CIQA/r7-reimport.log
      - name: Rebuild 1418 R8 detailed background buildings and validate the original 2x1 km
        run: |
          set -euo pipefail
          python -c "import bpy,runpy;runpy.run_path('Tools/Blender/generate_r8_full_city_facades.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/r8-background.log
          python -c "import bpy,runpy;runpy.run_path('Tools/tests/test_r8_native_fbx.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/r8-reimport.log
      - name: Select 48 true OSM trees out of 120 candidates excluding real road triangle footprints
        run: |
          set -euo pipefail
          python Tools/geo/generate_r6_vegetation.py --pilot-count 120 --output geo/procedural/R9_VEGETATION_CANDIDATES_120.json 2>&1 | tee build/R9_CIQA/candidates.log
          python -c "import bpy,runpy;runpy.run_path('Tools/Blender/select_r9_vegetation.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/road-clearance.log
      - name: Build actual coastal, park and dense 48-tree native Blender FBX
        run: |
          set -euo pipefail
          python -c "import bpy,runpy;runpy.run_path('Tools/Blender/generate_r9_urban_environment.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/urban-generate.log
          python -c "import bpy,runpy;runpy.run_path('Tools/tests/test_r9_environment_native.py',run_name='__main__')" 2>&1 | tee build/R9_CIQA/urban-fbx-reimport.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Resort-R9-Real-Coast-Green-Parks-48-Trees-2x1km
          path: |
            UnityProject/Assets/Architecture/R7_Pilot50/
            UnityProject/Assets/Architecture/R8_FullCity/
            UnityProject/Assets/Architecture/R9_Environment/
            geo/procedural/R9_VEGETATION_CANDIDATES_120.json
            geo/procedural/R9_VEGETATION_SELECTED.json
            build/R9_CIQA/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Resort-R9-Failure-Logs-No-Release
          path: build/R9_CIQA/
          if-no-files-found: warn
